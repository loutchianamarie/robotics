name: Python checks
on:
  push:
  pull_request:
jobs:
  pure-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m compileall -q ros2_ws/src/multi_sensor_perception
      - run: PYTHONPATH=ros2_ws/src/multi_sensor_perception python -m pytest -q ros2_ws/src/multi_sensor_perception/test/test_perception_math.py
